<!DOCTYPE html>
<html lang="ar">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>J.A.R.V.I.S</title>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700&family=Rajdhani:wght@500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#030a16;--panel:rgba(8,28,58,.55);--line:#12365f;--cy:#22d3ee;--bl:#1e6fe0;--tx:#cfe6ff;--mu:#6f93b8;--ok:#34d399;--bad:#f87171}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;color:var(--tx);font-family:Rajdhani,sans-serif;font-size:18px;padding-top:env(safe-area-inset-top);padding-bottom:100px;background:repeating-linear-gradient(0deg,rgba(34,211,238,.05) 0 1px,transparent 1px 3px),radial-gradient(ellipse at 50% 30%,#0a2a55 0,#04122a 55%,var(--bg) 100%);background-attachment:fixed;overflow-x:hidden}
main{max-width:560px;margin:0 auto;padding:14px 22px 30px}
header{display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid var(--line);padding-bottom:10px;gap:5px}
h1{margin:0;font:700 24px Orbitron,sans-serif;letter-spacing:.15em;color:var(--cy);text-shadow:0 0 14px var(--cy);flex-shrink:0}
#clock{font:500 12px Orbitron,sans-serif;color:var(--cy);white-space:nowrap;margin-left:auto}
#langBtn{background:transparent;border:1px solid var(--cy);color:var(--cy);border-radius:12px;padding:2px 8px;font-size:12px;font-family:Orbitron;cursor:pointer;margin-inline-end:5px;flex-shrink:0}
#hud{width:100%;display:block;margin:14px 0;cursor:pointer;border-radius:50%;transition:transform .2s}
#hud:active{transform:scale(0.98)}
.sp{transform-box:fill-box;transform-origin:center;animation:spin 40s linear infinite}
.sp2{animation-duration:26s;animation-direction:reverse}.sp3{animation-duration:90s}
@keyframes spin{to{transform:rotate(360deg)}} @keyframes beat{50%{transform:scale(1.12)}}
#core{transform-box:fill-box;transform-origin:center}
body.listening #core{animation:beat 1.8s ease-in-out infinite}
body.thinking .sp{animation-duration:6s}
body.speaking #core{animation:beat .5s ease-in-out infinite}
body.speaking .glow{fill:#34d399}
#state{text-align:center;font:500 14px Orbitron,sans-serif;letter-spacing:.3em;color:var(--cy);margin-bottom:6px}
#micNote{text-align:center;font-size:14px;color:var(--mu);margin-bottom:12px;min-height:1.2em}
.panel{background:var(--panel);border:1px solid var(--line);padding:12px 16px;margin-bottom:14px;clip-path:polygon(0 0,calc(100% - 18px) 0,100% 18px,100% 100%,0 100%)}
h2{margin:0 0 10px;font:700 16px Orbitron,sans-serif;color:var(--cy);border-bottom:1px dashed rgba(34,211,238,.2);padding-bottom:8px;display:flex;justify-content:space-between;align-items:center}
#log{height:130px;overflow-y:auto;color:var(--mu);line-height:1.4;font-size:16px}
#log div{margin-bottom:6px;padding-bottom:6px;border-bottom:1px dashed rgba(255,255,255,.05)}
#log .j{color:var(--cy)} #log .u{color:var(--tx)} #log .err{color:var(--bad)}
.row{display:flex;justify-content:space-between;align-items:center;padding:6px 0;font-size:16px}
.dot{display:inline-block;width:10px;height:10px;border-radius:50%;background:var(--bad);margin-inline-start:8px}
.on .dot{background:var(--ok);box-shadow:0 0 8px var(--ok)} .on span:last-child{color:var(--ok)}
.m{margin:8px 0 4px;display:flex;justify-content:space-between;font-size:14px;color:var(--mu)}
.m span:last-child{color:var(--tx);font-family:Orbitron,sans-serif;font-size:13px}
.bar{height:6px;background:#0b2447;border-radius:3px;overflow:hidden;margin-bottom:8px}
.bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--bl),var(--cy));transition:width .5s}
.bottom-bar{position:fixed;bottom:0;left:0;right:0;background:rgba(3,10,22,.95);backdrop-filter:blur(10px);border-top:1px solid var(--line);padding:12px 16px calc(12px + env(safe-area-inset-bottom));z-index:100;display:flex;gap:8px;max-width:560px;margin:0 auto}
input,button{font:inherit;color:var(--tx);background:rgba(8,28,58,.8);border:1px solid var(--line);border-radius:24px;outline:none}
input{flex:1;min-width:0;padding:12px 16px}
input:focus{border-color:var(--cy)}
button{cursor:pointer;font-family:Orbitron,sans-serif;font-size:13px;padding:0 20px;min-height:44px;transition:0.2s}
button:active{transform:scale(.95)}
#send{background:var(--cy);color:#000;border-color:var(--cy);font-weight:bold}
.ig{display:flex;flex-direction:column;gap:4px;margin-bottom:8px}
.ig label{font-size:12px;color:var(--mu)}
.ig input{border-radius:8px;padding:10px;font-size:14px;background:#06101f}
#saveBtn{background:var(--ok);color:#000;border:none;border-radius:8px;width:100%;padding:12px;font-weight:bold;margin-top:8px}

/* ===== arc-reactor look ===== */
body{background:
  radial-gradient(ellipse at 50% 26%,rgba(0,140,255,.32) 0,rgba(0,70,170,.18) 38%,transparent 70%),
  repeating-linear-gradient(90deg,rgba(34,211,238,.06) 0 1px,transparent 1px 68px),
  repeating-linear-gradient(0deg,rgba(34,211,238,.045) 0 1px,transparent 1px 3px),
  linear-gradient(#04153a,#020a1c) !important;background-attachment:fixed !important}
#hud{overflow:visible;width:100%;max-width:560px;margin:6px auto 10px;border-radius:0}
.spin{transform-box:view-box;transform-origin:200px 200px;animation:spin var(--d,60s) linear infinite}
.spin.rev{animation-direction:reverse}
body.listening .spin{animation-duration:calc(var(--d,60s) * .5)}
body.thinking .spin{animation-duration:calc(var(--d,60s) * .1)}
#t1 line{stroke-width:1.1}
#t2 line{stroke-width:3.3;stroke-linecap:round}
.glow{animation:glowp 3.2s ease-in-out infinite}
@keyframes glowp{50%{opacity:.78}}
body.listening .glow{filter:hue-rotate(-35deg)}
body.speaking .glow{fill:url(#g) !important;filter:hue-rotate(-50deg)}
</style>
</head>
<body>
<main>
<header>
  <div style="display:flex;align-items:center">
    <button id="langBtn" onclick="toggleLang()">AR</button>
    <button id="keyBtn" onclick="toggleKeys()" style="background:transparent;border:1px solid var(--cy);color:var(--cy);border-radius:12px;padding:2px 9px;font-size:14px;font-family:Orbitron;cursor:pointer;margin-inline-end:5px;flex-shrink:0">⚙</button>
    <h1>J.A.R.V.I.S</h1>
  </div>
  <div id="clock">--:--:--</div>
</header>

<svg id="hud" viewBox="-20 -20 440 440">
<defs>
<radialGradient id="g"><stop offset="0" stop-color="#fff"/><stop offset=".28" stop-color="#5ff0ff"/><stop offset=".6" stop-color="#1ab8ff" stop-opacity=".55"/><stop offset="1" stop-color="#0a7cff" stop-opacity="0"/></radialGradient>
<radialGradient id="halo"><stop offset="0" stop-color="#0a5fd8" stop-opacity=".55"/><stop offset=".6" stop-color="#0a3d9a" stop-opacity=".25"/><stop offset="1" stop-color="#041a4a" stop-opacity="0"/></radialGradient>
</defs>
<circle cx="200" cy="200" r="196" fill="url(#halo)"/>
<g fill="none" stroke-linecap="round">
<g class="spin" style="--d:140s" stroke="#22d3ee" stroke-opacity=".5"><g id="t1"></g></g>
<g class="spin rev" style="--d:90s" id="t3" stroke="#5de0ff"></g>
<g class="spin" style="--d:70s" stroke="#3b9bff" stroke-width="7"><path d="M55.4 116.5 A167 167 0 0 1 145.6 42.1"/><path d="M211.6 33.4 A167 167 0 0 1 353.7 134.7"/><path d="M366.9 194.2 A167 167 0 0 1 336.8 295.8"/><path d="M275.8 348.8 A167 167 0 0 1 116.5 344.6"/><path d="M68.4 302.8 A167 167 0 0 1 38.0 159.6"/></g>
<g class="spin rev" style="--d:46s" stroke="#22d3ee" stroke-width="2"><circle cx="200" cy="200" r="147" stroke-dasharray="95 9 16 9 38 9 12 9 60 9"/></g>
<circle cx="200" cy="200" r="131" stroke="#22d3ee" stroke-opacity=".55" stroke-dasharray="1 4"/>
<g class="spin" style="--d:150s" stroke="#22d3ee"><g id="t2"></g></g>
<circle cx="200" cy="200" r="100" stroke="#22d3ee" stroke-opacity=".45"/>
<circle cx="200" cy="200" r="68" stroke="#22d3ee" stroke-opacity=".35"/>
<circle cx="200" cy="200" r="38" stroke="#22d3ee" stroke-opacity=".5"/>
<g class="spin" style="--d:9s"><path d="M200 200 L130.5 128.1 A100 100 0 0 0 101.5 182.6 Z" fill="rgba(34,211,238,.13)" stroke="none"/><line x1="200" y1="200" x2="130.5" y2="128.1" stroke="#22d3ee" stroke-opacity=".8" stroke-width="1.3"/></g>
<g id="dots" class="spin rev" style="--d:240s" stroke="none"></g>
<circle class="glow" cx="200" cy="200" r="54" fill="url(#g)" stroke="none"/>
<polygon id="core" points="231.9,188.4 226.0,221.9 194.1,233.5 168.1,211.6 174.0,178.1 205.9,166.5" stroke="#8ff6ff" stroke-width="1.8" fill="rgba(34,211,238,.2)"/>
<circle cx="200" cy="200" r="6" fill="#fff" stroke="none"/>
</g></svg>
<script>
(function(){
  const NS="http://www.w3.org/2000/svg";
  let s=11;
  const rnd=()=>{s|=0;s=s+0x6D2B79F5|0;let t=Math.imul(s^s>>>15,1|s);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296};
  const mk=(p,tag,at)=>{const e=document.createElementNS(NS,tag);for(const k in at)e.setAttribute(k,at[k]);p.appendChild(e)};
  const dots=document.getElementById("dots");
  for(let i=0;i<72;i++){
    const a=rnd()*6.283,r=40+rnd()*108;
    mk(dots,"circle",{cx:200+r*Math.cos(a),cy:200+r*Math.sin(a),r:(0.7+rnd()*2).toFixed(2),fill:rnd()<.2?"#9ff7ff":"#22d3ee","fill-opacity":(.35+.65*rnd()).toFixed(2)});
  }
  const t3=document.getElementById("t3");
  for(let i=0;i<150;i++){
    const a=i*6.283/150,big=rnd()<.1,r1=big?196:200,r2=big?(210+rnd()*6):(204+rnd()*4);
    mk(t3,"line",{x1:200+r1*Math.cos(a),y1:200+r1*Math.sin(a),x2:200+r2*Math.cos(a),y2:200+r2*Math.sin(a),"stroke-opacity":big?.9:.28,"stroke-width":big?1.8:1});
  }
})();
</script>

<div id="state">TAP JARVIS TO SPEAK</div>
<div id="micNote" aria-live="polite"></div>

<div class="panel" id="setupPanel">
  <h2>AI CONFIGURATION</h2>
  <div class="ig"><label>اسمك</label><input type="text" id="kName" placeholder="مثلاً: يا توني"></div>
  <div class="ig"><label>OpenAI (GPT) Key</label><input type="password" id="kGpt" placeholder="sk-..."></div>
  <div class="ig"><label>Groq Key (مجاني)</label><input type="password" id="kGroq" placeholder="gsk_..."></div>
  <div class="ig"><label>Gemini API Key (مجاني - الأفضل: عقل + صوت + شاشة)</label><input type="password" id="kGem" placeholder="AIza..."></div>
  <div class="ig" id="localBox">
    <label>Local Server URL (llama.cpp - بدون إنترنت)</label>
    <input type="text" id="kLocalUrl" placeholder="http://127.0.0.1:8080/v1" value="http://127.0.0.1:8080/v1">
    <label style="margin-top:8px;display:flex;align-items:center;gap:8px;color:var(--tx)"><input type="checkbox" id="cLocal" style="width:18px;height:18px;padding:0;flex:none"> استخدم المحرك المحلي (Local LLM)</label>
    <label style="margin-top:6px;display:flex;align-items:center;gap:8px;color:var(--tx)"><input type="checkbox" id="cLocalOnly" checked style="width:18px;height:18px;padding:0;flex:none"> محلي فقط (من غير إنترنت ولا سحابة)</label>
    <label style="margin-top:6px;display:flex;align-items:center;gap:8px;color:var(--tx)"><input type="checkbox" id="cSttDev" style="width:18px;height:18px;padding:0;flex:none"> التعرف على الصوت من الجهاز (SpeechRecognizer)</label>
    <button type="button" id="testLocalBtn" onclick="testLocal()" style="background:#1e6fe0;color:#fff;border:none;border-radius:8px;width:100%;padding:10px;font-weight:bold;margin-top:8px;font-family:Orbitron,sans-serif;font-size:12px;cursor:pointer">TEST LOCAL SERVER</button>
  </div>
  <div class="ig" id="fishBox"><label>Fish Audio Key (صوت Jarvis MCU)</label><input type="password" id="kFish" placeholder="Fish API key"><label style="margin-top:6px">Fish Voice ID (من رابط الصوت fish.audio/m/...)</label><input type="text" id="kFishV" placeholder="Voice ID"></div>
  <div class="ig" id="extraBox"><label>DeepSeek Key (اختياري)</label><input type="password" id="kDs" placeholder="sk-..."><label style="margin-top:6px">Kimi (Moonshot) Key (اختياري)</label><input type="password" id="kKimi" placeholder="sk-..."><label style="margin-top:6px">GitHub Token (لحفظ الذاكرة والمشاريع)</label><input type="password" id="kGh" placeholder="ghp_... / github_pat_..."><label style="margin-top:6px">GitHub Repo (owner/name)</label><input type="text" id="kGhRepo" placeholder="username/jarvis-brain"></div>
  <button id="saveBtn" onclick="saveKeys()">SAVE & CONNECT</button>
  <button id="resetKeys" onclick="resetKeys()" style="background:#f87171;color:#000;border:none;border-radius:8px;width:100%;padding:10px;font-weight:bold;margin-top:8px;font-family:Orbitron,sans-serif;font-size:12px;cursor:pointer">RESET ALL KEYS</button>
</div>

<div class="panel">
<h2>COMMAND LOG</h2>
<div id="log" dir="auto" aria-live="polite"></div>
<div class="row" id="rAi" style="border:none"><span>AI ENGINE</span><span><b id="vAi">checking</b><i class="dot"></i></span></div>
</div>

<div class="panel">
<h2>SYSTEM</h2>
<div id="sysContainer"></div>
</div>
</main>

<div class="bottom-bar">
  <input id="txt" placeholder="Type here..." aria-label="رسالة">
  <button id="send" type="button">SEND</button>
</div>

<script>
const $=id=>document.getElementById(id), NS="http://www.w3.org/2000/svg";
let keys={ gpt:localStorage.getItem("k_gpt")||"", groq:localStorage.getItem("k_groq")||"", gem:localStorage.getItem("k_gem")||"" };
let userName=localStorage.getItem("jv_name")||"Boss"; if(userName==="يا فندم") userName="Boss";
let listening=false,busy=false,voices=[], currentLang="ar-EG";

// 1. Build UI & Stats
(function(){
  const mk=(p,a,b,c,d)=>{const l=document.createElementNS(NS,"line");l.setAttribute("x1",a);l.setAttribute("y1",b);l.setAttribute("x2",c);l.setAttribute("y2",d);p.appendChild(l)};
  for(let i=0;i<120;i++){const a=i*Math.PI/60,co=Math.cos(a),s=Math.sin(a);mk($("t1"),200+192*co,200+192*s,200+(i%5?196:200)*co,200+(i%5?196:200)*s)}
  for(let i=0;i<72;i++){const a=i*Math.PI/36,co=Math.cos(a),s=Math.sin(a);mk($("t2"),200+112*co,200+112*s,200+(i%2?118:124)*co,200+(i%2?118:124)*s)}
  ["fps","mem","net","bat"].forEach(id=>$("sysContainer").innerHTML+=`<div class="m"><span>${id.toUpperCase()}</span><span id="v_${id}">--</span></div><div class="bar"><i id="b_${id}"></i></div>`);
})();

// 2. Clock & Stats Loop
setInterval(()=>{$("clock").textContent=new Date().toLocaleTimeString("en-US",{hour:"2-digit",minute:"2-digit",second:"2-digit",hour12:true})},1000);
let frames=0; requestAnimationFrame(function loop(){frames++;requestAnimationFrame(loop)});
setInterval(()=>{
  $("v_fps").textContent=frames+" fps"; $("b_fps").style.width=Math.min(100,frames/1.2)+"%"; frames=0;
  if(performance.memory){$("v_mem").textContent=Math.round(performance.memory.usedJSHeapSize/1048576)+" MB";$("b_mem").style.width=(performance.memory.usedJSHeapSize/performance.memory.jsHeapSizeLimit*100)+"%"}
  if(navigator.connection){$("v_net").textContent=navigator.connection.downlink+" Mbps";$("b_net").style.width=Math.min(100,navigator.connection.downlink*2)+"%"}
},1000);
if(navigator.getBattery)navigator.getBattery().then(b=>{const u=()=>{$("v_bat").textContent=Math.round(b.level*100)+"%";$("b_bat").style.width=(b.level*100)+"%";};u();b.onlevelchange=u});

// 3. Language Toggle
function toggleLang(){
  currentLang = (currentLang === "ar-EG") ? "en-US" : "ar-EG";
  $("langBtn").textContent = (currentLang === "ar-EG") ? "AR" : "EN";
  $("micNote").textContent = currentLang === "ar-EG" ? "اللغة: عربي" : "Language: English";
  if(listening){ stopRec(); }
}
$("langBtn").textContent = "AR";

// 4. Human-like Voice Logic
if("speechSynthesis" in window){ speechSynthesis.onvoiceschanged=()=>voices=speechSynthesis.getVoices(); }
function speak(text){
  if(!("speechSynthesis" in window))return;
  speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(text);
  const isArabic = /[\u0600-\u06FF]/.test(text);
  
  let preferred = isArabic 
    ? ['Majed', 'Maged', 'Naayf', 'Shakir', 'Google العربية']
    : ['Daniel', 'Arthur', 'George', 'Google UK English Male'];
    
  let bestVoice = null;
  for(let name of preferred) {
    bestVoice = voices.find(v => v.name.includes(name));
    if(bestVoice) break;
  }
  if(!bestVoice) bestVoice = voices.find(v => v.lang.startsWith(isArabic ? "ar" : "en"));

  if(bestVoice) u.voice = bestVoice;
  u.pitch = 0.9;
  u.rate = 1.0;
  speechSynthesis.speak(u);
}

// 5. UI Helpers
function setState(c,t){document.body.className=c;$("state").textContent=t}
function addLog(c,t){$("log").innerHTML+=`<div class="${c}">› ${t}</div>`;$("log").scrollTop=$("log").scrollHeight}

// 6. API Logic & Personality
function saveKeys(){
  keys.gpt=$("kGpt").value.trim();
  keys.groq=$("kGroq").value.trim();
  keys.gem=$("kGem").value.trim();
  userName=$("kName").value.trim() || "Boss";
  localStorage.setItem("k_gpt",keys.gpt); localStorage.setItem("k_groq",keys.groq); localStorage.setItem("k_gem",keys.gem);
  localStorage.setItem("k_fish",$("kFish").value.trim()); localStorage.setItem("k_fishv",$("kFishV").value.trim());
  localStorage.setItem("k_localurl",$("kLocalUrl").value.trim()); localStorage.setItem("k_localon",$("cLocal").checked?"1":"0"); localStorage.setItem("k_localonly",$("cLocalOnly").checked?"1":"0"); localStorage.setItem("k_sttdev",$("cSttDev").checked?"1":"0");
  localStorage.setItem("k_ds",$("kDs").value.trim()); localStorage.setItem("k_kimi",$("kKimi").value.trim()); localStorage.setItem("k_gh",$("kGh").value.trim()); localStorage.setItem("k_ghrepo",$("kGhRepo").value.trim());
  localStorage.setItem("jv_name",userName);
  checkKeys(); addLog("j",`Keys saved. Hello ${userName}.`);
}
function testLocal(){
  if(window.AndroidBridge){ saveKeys(); AndroidBridge.testLocal(); }
  else addLog("err","الاختبار بيشتغل جوه تطبيق الأندرويد بس");
}
function toggleKeys(){
  const p=$("setupPanel"); const open=p.style.display==="none";
  p.style.display=open?"block":"none";
  if(open) p.scrollIntoView({behavior:"smooth",block:"center"});
}
function resetKeys(){
  ["k_gpt","k_groq","k_gem","k_fish","k_fishv","k_ds","k_kimi","k_gh","k_ghrepo","k_localurl","k_localon","k_localonly","k_sttdev"].forEach(k=>localStorage.removeItem(k));
  $("kLocalUrl").value="http://127.0.0.1:8080/v1"; $("cLocal").checked=false; $("cLocalOnly").checked=true; $("cSttDev").checked=false;
  keys.gpt=""; keys.groq=""; keys.gem="";
  ["kGpt","kGroq","kGem","kFish","kFishV","kDs","kKimi","kGh","kGhRepo"].forEach(i=>{ $(i).value=""; });
  checkKeys(); addLog("j","All keys cleared.");
}
function checkKeys(){
  const c=Object.values(keys).filter(k=>k).length + (localStorage.getItem("k_localon")==="1"?1:0);
  $("setupPanel").style.display=c?"none":"block";
  $("vAi").textContent=c?`${c} Models Ready`:"Missing";
  $("rAi").className=c?"row on":"row";
}
$("kGpt").value=keys.gpt; $("kGroq").value=keys.groq; $("kGem").value=keys.gem; $("kFish").value=localStorage.getItem("k_fish")||""; $("kFishV").value=localStorage.getItem("k_fishv")||""; $("kLocalUrl").value=localStorage.getItem("k_localurl")||"http://127.0.0.1:8080/v1"; $("cLocal").checked=localStorage.getItem("k_localon")==="1"; $("cLocalOnly").checked=localStorage.getItem("k_localonly")!=="0"; $("cSttDev").checked=localStorage.getItem("k_sttdev")==="1"; $("kDs").value=localStorage.getItem("k_ds")||""; $("kKimi").value=localStorage.getItem("k_kimi")||""; $("kGh").value=localStorage.getItem("k_gh")||""; $("kGhRepo").value=localStorage.getItem("k_ghrepo")||""; $("kName").value=userName; checkKeys();

function getSystemPrompt() {
  return `أنت J.A.R.V.I.S. مساعد شخصي ذكي جداً. المستخدم هو "${userName}". بتناديه دايماً "${userName}" أو "يا فندم".
شخصيتك: رسمي، خفيف الدم، واثق. رد بنفس لغة المستخدم.
افهم الحروف الغلط. لو طلب فتح تطبيق، حدد اسمه بالإنجليزي في "app_name".
ترد بـ JSON فقط:
{"reply":"الرد القصير","action":"open_app|search_youtube|whatsapp|call|none","app_name":"...","query":"...","contact":"...","message":"..."}`;
}

async function fetchAI(provider, prompt){
  if(!keys[provider]) throw new Error("Missing key");
  let url, headers, body;
  const sys = getSystemPrompt();
  
  if(provider === "gpt"){
    url = "https://api.openai.com/v1/chat/completions";
    headers = {"Authorization":`Bearer ${keys.gpt}`,"Content-Type":"application/json"};
    body = {model:"gpt-4o",response_format:{type:"json_object"},messages:[{role:"system",content:sys},{role:"user",content:prompt}]};
  } 
  else if(provider === "groq"){
    url = "https://api.groq.com/openai/v1/chat/completions";
    headers = {"Authorization":`Bearer ${keys.groq}`,"Content-Type":"application/json"};
    body = {model:"llama-3.3-70b-versatile",response_format:{type:"json_object"},messages:[{role:"system",content:sys},{role:"user",content:prompt}]};
  }
  const res = await fetch(url, {method:"POST",headers,body:JSON.stringify(body)});
  const data = await res.json();
  if(!res.ok) throw new Error(provider + " Error");
  return {text:data.choices[0].message.content, source:provider.toUpperCase()};
}

async function askAI(prompt){
  const available = [];
  if(keys.gpt) available.push(fetchAI("gpt",prompt).catch(e => { addLog("err", "GPT: "+e.message); return null; }));
  if(keys.groq) available.push(fetchAI("groq",prompt).catch(e => { addLog("err", "Groq: "+e.message); return null; }));
  const results = (await Promise.all(available)).filter(r => r !== null);
  if(!results.length) throw new Error("كل الموديلات فشلت.");
  if(results.length === 1) return parseRes(results[0]);
  
  let combined=""; results.forEach(r=>combined+=`\n[${r.source}]: ${r.text}`);
  let judge = keys.gpt ? "gpt" : "groq";
  try{
    const final=await fetchAI(judge,`سؤال: ${prompt}\nإجابات:${combined}\nادمجهم في JSON.`,`أنت JARVIS. دمج في {"reply":"...","action":"...","app_name":"...","query":"...","contact":"...","message":"..."}`);
    let p=parseRes(final); p.source="Ensemble"; return p;
  }catch(e){ return parseRes(results[0]); }
}

function parseRes(r){
  let t=r.text.replace(/^```(?:json)?/i,"").replace(/```$/,"").trim(), p={reply:t,action:"none"};
  try{p=JSON.parse(t)}catch(e){}
  p.source=r.source; return p;
}

// 7. App Executor
function executeAction(r){
  const app=r.app_name ? r.app_name.toLowerCase().trim() : "";
  const query=encodeURIComponent(r.query||"");
  const msg=encodeURIComponent(r.message||"");
  
  if(r.action==="search_youtube"){
    addLog("j",`⚡ بحث يوتيوب: ${r.query}`);
    window.location.href = `vnd.youtube://results?search_query=${query}`;
  }
  else if(r.action==="whatsapp"){
    addLog("j",`💬 واتساب: ${r.contact || ""}`);
    window.location.href = `whatsapp://send?text=${msg}`; 
  }
  else if(r.action==="call"){
    addLog("j",`📞 اتصال: ${r.contact}`);
    window.location.href = `tel:`;
  }
  else if(r.action==="open_app"){
    const links={
      "youtube":"vnd.youtube://", "whatsapp":"whatsapp://", "facebook":"fb://", 
      "instagram":"instagram://app", "twitter":"twitter://", "telegram":"tg://", 
      "spotify":"spotify://", "netflix":"nflx://", "tiktok":"snssdk1128://", 
      "maps":"geo:0,0?q=", "camera":"intent://#Intent;action=android.media.action.IMAGE_CAPTURE;end", 
      "phone":"tel:", "messages":"sms:", "settings":"intent://#Intent;action=android.settings.SETTINGS;end", 
      "chrome":"googlechrome://", "calculator":"intent://#Intent;action=android.intent.action.CALCULATOR;end"
    };
    if(links[app]){ addLog("j",`⚡ فتح ${app}`); window.location.href=links[app]; }
  }
}

// 8. Main Loop
async function handle(t){
  if(!t||busy)return; busy=true; setState("thinking","THINKING"); addLog("u",t);
  try{
    const r=await askAI(t);
    if(r.reply){ addLog("j",`[${r.source}] ${r.reply}`); setState("speaking","SPEAKING"); await new Promise(res=>{speak(r.reply);setTimeout(res,2500)}); }
    executeAction(r);
  }catch(e){ addLog("err","Error: "+e.message); }
  busy=false; setState("","TAP JARVIS TO SPEAK");
}

// 9. Single-Shot Mic Logic
const SR=window.SpeechRecognition||window.webkitSpeechRecognition; let rec=null;
function startRec(){
  if(!SR||busy)return;
  try{
    rec=new SR(); rec.lang=currentLang; rec.interimResults=false; rec.maxAlternatives=1;
    rec.onstart=()=>{$("micNote").textContent="🎤 يستمع...";$("micNote").className="ok"};
    rec.onresult=e=>{
      const text = e.results[0][0].transcript;
      $("txt").value = text;
      stopRec(); 
      handle(text); 
    };
    rec.onerror=e=>{ addLog("err","Mic Error: "+e.error); stopRec(); };
    rec.onend=()=>{ stopRec(); };
    rec.start();
  }catch(e){ stopRec(); }
}
function stopRec(){
  if(rec){ try{rec.abort()}catch(e){} rec=null; }
  listening=false;
  if(!busy) setState("","TAP JARVIS TO SPEAK");
}
function toggle(){
  if(!keys.gpt && !keys.groq)return alert("حط مفتاح واحد على الأقل");
  if(listening){ stopRec(); }
  else { listening=true; setState("listening","LISTENING"); startRec(); }
}
$("hud").onclick=toggle; 
$("send").onclick=()=>{const v=$("txt").value;$("txt").value="";handle(v)};
$("txt").onkeydown=e=>{if(e.key==="Enter")$("send").click()};
addLog("j","JARVIS online. Systems ready.");
</script>

# Alternative: LLaMA-Factory (Apache-2.0) fine-tuning of Qwen2.5-VL. NOT RUN here (needs a GPU).
# Qwen2.5-VL-3B-Instruct is released under the "qwen-research" licence (research use): read it before distributing the result.
# Usage: copy data/ next to LLaMA-Factory's data/, then:  llamafactory-cli train training/llamafactory_qwen2vl_lora.yaml
model_name_or_path: Qwen/Qwen2.5-VL-3B-Instruct
stage: sft
do_train: true
finetuning_type: lora
lora_target: all
quantization_bit: 4
dataset: jarvis_train
dataset_dir: data
template: qwen2_vl
cutoff_len: 4096
output_dir: out/jarvis-qwen2vl-lora
per_device_train_batch_size: 1
gradient_accumulation_steps: 8
learning_rate: 1.0e-4
num_train_epochs: 2
bf16: true
logging_steps: 10
save_steps: 200

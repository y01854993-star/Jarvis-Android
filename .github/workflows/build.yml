name: Build APK
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      signed: ${{ steps.signing.outputs.enabled }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7
      - name: Prepare release signing
        id: signing
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_RELEASE_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_RELEASE_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_RELEASE_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_RELEASE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -n "$KEYSTORE_BASE64" ] && [ -n "$KEYSTORE_PASSWORD" ] && [ -n "$KEY_ALIAS" ] && [ -n "$KEY_PASSWORD" ]; then
            key_path="$RUNNER_TEMP/jarvis-release.jks"
            printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$key_path"
            chmod 600 "$key_path"
            echo "enabled=true" >> "$GITHUB_OUTPUT"
            echo "keystore=$key_path" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "Release signing secrets are not configured; building a debug artifact only."
          fi
      - name: Build signed release APK
        if: steps.signing.outputs.enabled == 'true'
        env:
          ANDROID_RELEASE_KEYSTORE: ${{ steps.signing.outputs.keystore }}
          ANDROID_RELEASE_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_RELEASE_KEYSTORE_PASSWORD }}
          ANDROID_RELEASE_KEY_ALIAS: ${{ secrets.ANDROID_RELEASE_KEY_ALIAS }}
          ANDROID_RELEASE_KEY_PASSWORD: ${{ secrets.ANDROID_RELEASE_KEY_PASSWORD }}
          ANDROID_VERSION_CODE: ${{ github.run_number }}
        run: |
          set -euo pipefail
          gradle assembleRelease --no-daemon
          mkdir -p dist
          cp app/build/outputs/apk/release/app-release.apk dist/jarvis.apk
      - name: Build debug APK for CI testing only
        if: steps.signing.outputs.enabled != 'true'
        run: |
          set -euo pipefail
          gradle assembleDebug --no-daemon
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk dist/jarvis.apk
      - uses: actions/upload-artifact@v4
        with:
          name: jarvis-apk
          path: dist/jarvis.apk
          if-no-files-found: error
          retention-days: 30

  publish-release:
    if: github.event_name == 'workflow_dispatch' && needs.build.outputs.signed == 'true'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: jarvis-apk
          path: dist
      - name: Publish signed release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release create "jarvis-${GITHUB_RUN_NUMBER}-${GITHUB_RUN_ATTEMPT}" dist/jarvis.apk \
            --target "${GITHUB_SHA}" \
            --title "Jarvis ${GITHUB_RUN_NUMBER}.${GITHUB_RUN_ATTEMPT}" \
            --notes "Signed Jarvis Android build from ${GITHUB_SHA}."

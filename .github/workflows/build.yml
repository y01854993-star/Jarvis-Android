name: Build APK
on:
  push:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7
      - name: Build debug APK
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          set -o pipefail
          gradle assembleDebug --no-daemon 2>&1 | tee build.log
      - name: Upload APK (branches)
        if: github.ref != 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: jarvis-apk-build-${{ github.run_number }}
          path: app/build/outputs/apk/debug/app-debug.apk
      - name: Publish release
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk jarvis.apk
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest jarvis.apk --title "Jarvis APK" --notes "Latest build" --target "${{ github.sha }}"
      - name: Publish build log
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tail -n 300 build.log > buildlog.txt || echo "no log" > buildlog.txt
          gh release delete buildlog --yes --cleanup-tag || true
          gh release create buildlog buildlog.txt --title "Build log" --notes "log" --target "${{ github.sha }}"
